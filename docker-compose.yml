services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: anvil --host 0.0.0.0 --port 8545 --chain-id 31337
    ports:
      - "127.0.0.1:8545:8545"
    # Local dev only. Never expose Anvil beyond loopback.

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
    # Local dev only. Never expose MQTT beyond loopback.
