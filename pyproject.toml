[project]
name = "privacygate-native-v2"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "cryptography>=44,<50", "httpx>=0.28,<1", "scikit-learn>=1.7,<2", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["apps/gateway/src"]
testpaths = ["apps/gateway/tests/v2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv]
package = false
