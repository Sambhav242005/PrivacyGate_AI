# PrivacyGate AI — local Mosquitto (dev only, loopback).
# MQTT transport for simulator <-> gateway. Third-party delivery is HTTP pull, never MQTT.
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true
per_listener_settings true
acl_file /mosquitto/config/acl.conf
# Sensor messages must use QoS 1 with retained=false (enforced by publisher code,
# see simulator; broker keeps retained support off for sensor topics via ACL deny below).
retain_available false
persistence false
log_dest stdout
connection_messages true
