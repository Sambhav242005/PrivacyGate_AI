[project]
name = "privacygate-simulator"
version = "0.1.0"
description = "PG-011 deterministic signed telemetry simulator"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=1.6", "PyNaCl>=1.5"]

[project.scripts]
pg-simulator = "simulator.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests", "apps/simulator/tests"]

[tool.ruff]
line-length = 100
