[project]
name = "privacygate-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "eth-account>=0.11",
  "pynacl>=1.5",
  "cryptography>=41",
  "paho-mqtt>=1.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "web3>=6.0",
  "openai>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
